<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="90%" stop-color="#E2E6EE" />
      <stop offset="100%" stop-color="#C5CCD9" />
    </radialGradient>
  </defs>
  <!-- Outer rim -->
  <circle cx="50" cy="50" r="49" fill="url(#rim)" />
  <!-- Inner navy disc -->
  <circle cx="50" cy="50" r="45" fill="#1D2F71" />
  <!-- Inner subtle border -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#3A52A8" stroke-width="1" />
  <!-- Monogram UN -->
  <text x="50" y="58" font-family="'Times New Roman', Georgia, serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">UN</text>
  <!-- Subtext UNION NORTH banner -->
  <rect x="20" y="47" width="60" height="9" fill="#111C48" rx="2" />
  <text x="50" y="54" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">UNION NORTH</text>
</svg>
